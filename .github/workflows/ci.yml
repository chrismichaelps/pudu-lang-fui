name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  PUDU_VERSION: "0.1.3"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Pudu from its published archive
        run: |
          set -euo pipefail
          archive="pudu-${PUDU_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/chrismichaelps/pudu-lang/releases/download/v${PUDU_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/pudu-${PUDU_VERSION}-linux-amd64/bin" >> "$GITHUB_PATH"
      - run: pudu version
      - name: Check
        run: pudu check $(find src test tools examples website -name '*.pudu')
      - name: Format
        run: pudu fmt --check src test tools examples website/Previews.pudu
      - name: Lint
        run: pudu lint src test tools examples website/Previews.pudu
      - name: Dependency layers
        run: pudu run tools/Layers.pudu
      - name: Dependency layers suite
        run: pudu test tools/LayersTest.pudu
      - name: Test
        run: pudu test test
      - name: Examples
        run: |
          set -euo pipefail
          for example in examples/*.pudu; do
            echo "::group::$example"
            pudu run "$example" > /dev/null
            echo "::endgroup::"
          done

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Pudu from its published archive
        run: |
          set -euo pipefail
          archive="pudu-${PUDU_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/chrismichaelps/pudu-lang/releases/download/v${PUDU_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/pudu-${PUDU_VERSION}-linux-amd64/bin" >> "$GITHUB_PATH"
      - name: Mutation testing on the pure layers
        run: pudu run tools/Mutate.pudu --pure --threshold 80
